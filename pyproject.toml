[project]
name = "orcaslicer-mcp"
version = "0.1.19"
description = "Community fork of OrcaSlicer MCP with direct Elegoo Centauri Carbon 2 printer controls"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Max Ellis" }]
maintainers = [{ name = "Nathan Hughes" }]
requires-python = ">=3.11"
keywords = ["mcp", "orcaslicer", "3d-printing", "slicer", "claude", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
]
dependencies = ["mcp>=2.2,<3", "anyio>=4.9", "httpx>=0.27,<1", "websockets>=12", "aiomqtt>=2.4,<3"]

[project.urls]
Homepage = "https://github.com/njhughes-01/orcaslicer-mcp"
Repository = "https://github.com/njhughes-01/orcaslicer-mcp"
Upstream = "https://github.com/MaxEllis/orcaslicer-mcp"
"OrcaSlicer MCP build (fork)" = "https://github.com/maxellis/OrcaSlicer"
Funding = "https://buymeacoffee.com/maxellis"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
orcaslicer-mcp = "orcaslicer_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orcaslicer_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
